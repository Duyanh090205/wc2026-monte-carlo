name: seed-group-winner

# One-off maintenance: rebuild the group-winner series from git as-of states and
# seed the Supabase group_winner_log table. Dispatch manually; safe to re-run —
# the seed merges with existing rows first, so live-captured Polymarket points
# (days where CLOB prices-history is silent) survive the clean-replace.
# --end pins the series to the last group-stage day; it is a closed record.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -e -o pipefail {0}   # tee must not mask a failed backfill/seed
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # backfill replays git history of wc2026_played.csv
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "numpy==2.4.*" "scipy==1.17.*" "pandas==3.0.*" "requests==2.34.*"
      - name: Backfill group-winner series (model per git state + Polymarket CLOB history)
        run: PYTHONPATH=src python -m mc_simu.backfill_group_winner --n 50000 --end 2026-06-27 | tee run.log
      - name: Seed Supabase group_winner_log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: PYTHONPATH=src python -m mc_simu.seed_group_winner | tee -a run.log
      - name: Job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 run.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
